name: Build and deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the website
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read the GitHub Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify both languages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # Pages may report HTTP while HTTPS is available; keep production metadata secure.
          export SITE_URL="${SITE_URL/#http:/https:}"
          python website/build_site.py
          python prepare_publish.py
          for file in website/*.js; do node --check "$file"; done
      - name: Upload the verified website
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/website-liveklaar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
